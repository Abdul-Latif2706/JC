
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login | Jonnie's Cutz</title>
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js" defer></script>
</head>
<body data-page="login">

    <main class="login-wrapper">
        <section class="login-card">

            <div class="brand-mark">JC</div>

            <p class="eyebrow">JONNIE'S CUTZ</p>
            <h1>Admin Portal</h1>
            <p class="subtitle">Welcome back. Sign in to manage your appointments.</p>

            <form id="admin-login-form">

                <div class="form-group">
                    <label for="admin-email">Email address</label>
                    <input
                        type="email"
                        id="admin-email"
                        placeholder="Enter your admin email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input
                        type="password"
                        id="admin-password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="login-button">
                    <span>Sign In</span>
                    <span class="arrow">→</span>
                </button>

                <p id="login-message" role="alert"></p>
            </form>

            <div class="security-note">
                <span>●</span> Secure Administrator Access
            </div>

        </section>

        <footer>
            © 2026 JONNIE'S CUTZ. ALL RIGHTS RESERVED.
        </footer>
    </main>

</body>
</html>
